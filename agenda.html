<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>กำหนดการ | Operations New Year Party 2027</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(160deg, #EEF2F7 0%, #D6DDE8 50%, #BFC8D7 100%);
      color: #0F172A;
      min-height: 100vh;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .agenda-pass-card {
      border-radius: 24px;
      border: 1px solid #B8C3D4;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.10);
      overflow: hidden;
      background-color: #F8FAFC;
    }

    .agenda-red-header {
      background: linear-gradient(135deg, #E60012 0%, #C4000F 55%, #8F000B 100%);
      padding: 20px 20px 18px;
    }

    .minimal-ruby-pill {
      display: inline-flex;
      align-items: center;
      padding: 3.5px 13px;
      background: rgba(74, 0, 6, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.40);
      border-radius: 9999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .agenda-body-surface {
      background: linear-gradient(180deg, #F8FAFC 0%, #EFF3F8 62%, #E5EBF3 100%);
    }

    .segmented-track {
      background-color: #E5EBF3;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid rgba(203, 213, 225, 0.75);
    }

    .segmented-tab-active {
      background-color: #FFFFFF;
      color: #0F172A;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.07);
    }

    .timeline-row-grid {
      display: grid;
      grid-template-columns: 58px 24px minmax(0, 1fr);
      column-gap: 10px;
      align-items: stretch;
    }

    @keyframes subtlePulseHalo {
      0%, 100% { box-shadow: 0 0 0 4px rgba(230, 0, 18, 0.15); }
      50%      { box-shadow: 0 0 0 7px rgba(230, 0, 18, 0.24); }
    }

    .live-dot-node {
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background-color: #E60012;
      animation: subtlePulseHalo 2.2s ease-in-out infinite;
    }

    .live-editorial-box {
      background-color: #FFFFFF;
      border: 1px solid #FECACA;
      border-left: 3px solid #E60012;
      border-radius: 14px;
      box-shadow: 0 10px 26px -8px rgba(230, 0, 18, 0.18);
    }

    .editorial-clean-card {
      background-color: rgba(255, 255, 255, 0.88);
      border: 1px solid #DCE4EE;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
    }

    .editorial-clean-card-live {
      background-color: #FFFFFF;
      border: 1.5px solid #E60012;
      border-radius: 16px;
      box-shadow:
        0 12px 28px -8px rgba(230, 0, 18, 0.20),
        0 0 0 3px rgba(230, 0, 18, 0.08);
    }

    .pass-notch-left,
    .pass-notch-right {
      position: absolute;
      top: 50%;
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      transform: translateY(-50%);
      background-color: #CBD4E1;
      border: 1px solid #B8C3D4;
      pointer-events: none;
    }
    .pass-notch-left { left: -10px; }
    .pass-notch-right { right: -10px; }

    .btn-minimal-red {
      background: linear-gradient(135deg, #E60012 0%, #A8000D 100%);
      box-shadow: 0 8px 20px -5px rgba(230, 0, 18, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
    }
    .btn-minimal-red:active { transform: scale(0.99); }

    .btn-minimal-platinum {
      background: linear-gradient(180deg, #FFFFFF 0%, #E6ECF4 100%);
      border: 1px solid #CBD5E1;
      color: #0F172A;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }
    .btn-minimal-platinum:active { transform: scale(0.99); }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center py-5 px-4 sm:py-8 selection:bg-[#E60012] selection:text-white">

  <main class="w-full max-w-[420px]">
    <div class="agenda-pass-card w-full">

      <!-- 1. MINIMAL LUXURY HEADER -->
      <header class="agenda-red-header">
        <div class="flex items-start justify-between gap-3">
          <div class="flex flex-col items-start">
            <div class="w-[118px] aspect-[22/10] -ml-[4px] flex items-center justify-start overflow-hidden shrink-0">
              <img
                src="https://img2.pic.in.th/True--W9082df0ce2da3b92.png"
                alt="true"
                onerror="this.onerror=null;this.src='https://placehold.co/236x106/E60012/FFFFFF?text=true';"
                class="w-full h-full object-cover block"
              />
            </div>
            <div class="minimal-ruby-pill mt-1.5">
              <span id="headerPillEl" class="text-[12.5px] font-semibold text-white tracking-wide leading-none">
                กำหนดการ
              </span>
            </div>
          </div>

          <div class="text-right pt-1 shrink-0">
            <p id="dateBadgeEl" class="tabular-nums text-[10px] font-medium tracking-[0.18em] uppercase text-white/85"></p>
            <p id="clockLabelEl" class="tabular-nums text-[11px] font-light text-white/70 mt-1"></p>
          </div>
        </div>

        <div class="mt-4 pt-3.5 border-t border-white/15">
          <h1 id="eventTitleEl" class="text-[18px] font-semibold text-white tracking-tight leading-snug"></h1>
          <p id="venueSubtextEl" class="text-[12px] font-light text-[#FFE4E6] mt-0.5 leading-relaxed"></p>
        </div>
      </header>

      <!-- 2. BODY -->
      <div class="agenda-body-surface">

        <!-- Segmented Filter Bar -->
        <div class="px-5 pt-4 pb-2">
          <div class="segmented-track grid grid-cols-2 gap-1">
            <button
              type="button"
              id="tabAllBtn"
              onclick="setAgendaFilter('ALL')"
              class="py-1.5 px-3 rounded-[9px] text-[12px] transition text-center"
            >
              กำหนดการทั้งหมด
            </button>
            <button
              type="button"
              id="tabHighlightBtn"
              onclick="setAgendaFilter('HIGHLIGHT')"
              class="py-1.5 px-3 rounded-[9px] text-[12px] transition text-center"
            >
              ช่วงไฮไลท์
            </button>
          </div>
        </div>

        <!-- Schedule List -->
        <div id="scheduleMount" class="px-5 pt-3 pb-4"></div>

        <!-- Perforated Divider -->
        <div class="relative h-[20px] flex items-center justify-center">
          <span class="pass-notch-left"></span>
          <div class="w-full border-t border-dashed border-[#CBD5E1] mx-4"></div>
          <span class="pass-notch-right"></span>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="px-5 pt-2.5 pb-5">
          <div class="grid grid-cols-2 gap-2.5">
            <a
              id="mapLinkEl"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-minimal-red rounded-[12px] py-2.5 px-3 text-center text-[12.5px] font-semibold text-white tracking-wide"
            >
              แผนที่การเดินทาง
            </a>
            <a
              id="winnersLinkEl"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-minimal-platinum rounded-[12px] py-2.5 px-3 text-center text-[12.5px] font-semibold tracking-wide"
            >
              รายชื่อผู้ได้รับรางวัล
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- Back to E-Ticket Link -->
    <div class="mt-4 pb-2 text-center">
      <a
        id="backTicketLinkEl"
        href="index.html"
        class="inline-block text-[12px] font-medium text-[#475569] hover:text-[#0F172A] underline underline-offset-4 decoration-slate-400/70 transition"
      >
        กลับหน้าบัตรเข้างาน (E-Ticket)
      </a>
    </div>
  </main>

  <script>
    /**
     * ========================================================================
     * ตั้งค่ารายละเอียดงานและตารางกำหนดการ (แก้ไขข้อความตรงนี้ได้ง่ายๆ ทันที)
     * ========================================================================
     */
    const EVENT_CONFIG = {
      "EVENT_NAME": "Operations New Year Party 2027",
      "HEADER_PILL_TEXT": "กำหนดการ",
      "DATE_BADGE": "27 NOV 2026",
      "VENUE_SUBTEXT": "18.00 – 24.00 น.  |  โรงแรม เอส รัชดา เลเชอร์",
      "EVENT_DATE_ISO": "2026-11-27",
      "ALWAYS_MATCH_TIME_OF_DAY": false,
      "LAYOUT_STYLE": "TIMELINE",
      "MAP_URL": "https://maps.app.goo.gl/85FVz4J4Ai2xE8h88",
      "WINNERS_URL": "https://liff.line.me/1657584836-rVBgBjPq",
      "ETICKET_URL": "https://liff.line.me/1656846002-2BvPPmrM",
      "SHEET_CSV_URL": ""
    };

    let AGENDA_ITEMS = [
      {
        "start": "18:00",
        "end": "19:00",
        "title": "ลงทะเบียนเช็คอินเข้างาน",
        "subtitle": "สแกน QR Code หน้างานและรับของที่ระลึก",
        "tag": "CHECK-IN",
        "isHighlight": false
      },
      {
        "start": "19:00",
        "end": "19:30",
        "title": "เพลิดเพลินกับ Live Music",
        "subtitle": "ร่วมรับประทานอาหารพร้อมกัน",
        "tag": "",
        "isHighlight": false
      },
      {
        "start": "19:30",
        "end": "20:30",
        "title": "พี่หยี กล่าวเปิดงาน",
        "subtitle": "และกิจกรรม Present การแต่งกาย",
        "tag": "OPENING",
        "isHighlight": true
      },
      {
        "start": "20:30",
        "end": "21:00",
        "title": "สนุกต่อกับ Live Music",
        "subtitle": "",
        "tag": "",
        "isHighlight": false
      },
      {
        "start": "21:00",
        "end": "22:00",
        "title": "ศิลปิน ยุค 90",
        "subtitle": "กับเพลงฮิตในตำนาน",
        "tag": "พบกับ",
        "isHighlight": true
      },
      {
        "start": "22:00",
        "end": "23:00",
        "title": "ประกาศผลการแต่งกาย",
        "subtitle": "Best Costume Awards",
        "tag": "Awards",
        "isHighlight": true
      },
      {
        "start": "23:00",
        "end": "24:00",
        "title": "DJ Party สุดมันส์",
        "subtitle": "พร้อมประกาศรางวัลพิเศษ (Special Awards)",
        "tag": "FINAL",
        "isHighlight": true
      }
    ];

    /**
     * ========================================================================
     * ระบบแสดงผลและไฮไลท์ช่วงเวลาปัจจุบันอัตโนมัติ
     * ========================================================================
     */
    let activeFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('headerPillEl').textContent = EVENT_CONFIG.HEADER_PILL_TEXT;
      document.getElementById('dateBadgeEl').textContent = EVENT_CONFIG.DATE_BADGE;
      document.getElementById('eventTitleEl').textContent = EVENT_CONFIG.EVENT_NAME;
      document.getElementById('venueSubtextEl').textContent = EVENT_CONFIG.VENUE_SUBTEXT;
      document.getElementById('mapLinkEl').href = EVENT_CONFIG.MAP_URL;
      document.getElementById('winnersLinkEl').href = EVENT_CONFIG.WINNERS_URL;
      document.getElementById('backTicketLinkEl').href = EVENT_CONFIG.ETICKET_URL;

      renderSchedule();

      if (EVENT_CONFIG.SHEET_CSV_URL) {
        await loadFromGoogleSheetCsv(EVENT_CONFIG.SHEET_CSV_URL);
      }

      setInterval(renderSchedule, 30000);
    });

    function setAgendaFilter(mode) {
      activeFilter = mode;
      renderSchedule();
    }

    function toDot(t) {
      return String(t || '').trim().replace(':', '.');
    }

    function parseMin(str, isEnd) {
      const s = String(str || '').trim().replace('.', ':');
      if (!s) return 0;
      const p = s.split(':');
      const hh = parseInt(p[0], 10);
      const mm = parseInt(p[1] || '0', 10);
      if (isNaN(hh) || isNaN(mm)) return 0;
      if ((hh === 24 && mm === 0) || (isEnd && hh === 0 && mm === 0)) return 1440;
      return hh * 60 + mm;
    }

    function getNowInfo() {
      const params = new URLSearchParams(window.location.search);
      const sim = params.get('simTime');
      const now = new Date();
      const isoDate =
        now.getFullYear() +
        '-' +
        String(now.getMonth() + 1).padStart(2, '0') +
        '-' +
        String(now.getDate()).padStart(2, '0');
      const realHHMM =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      if (sim && /^\d{1,2}:\d{2}$/.test(sim)) {
        return { hhmm: sim, forceMatchTime: true, isoDate: isoDate };
      }
      return { hhmm: realHHMM, forceMatchTime: EVENT_CONFIG.ALWAYS_MATCH_TIME_OF_DAY, isoDate: isoDate };
    }

    function getItemStatus(item, nowInfo) {
      if (!nowInfo.forceMatchTime && EVENT_CONFIG.EVENT_DATE_ISO && nowInfo.isoDate !== EVENT_CONFIG.EVENT_DATE_ISO) {
        return 'UPCOMING';
      }
      const cur = parseMin(nowInfo.hhmm, false);
      const start = parseMin(item.start, false);
      let end = parseMin(item.end, true);
      if (end <= start) end += 1440;

      if (cur >= 300 && cur < start) return 'UPCOMING';
      if (cur >= start && cur < end) return 'LIVE';
      if (cur >= end) return 'PAST';
      return 'UPCOMING';
    }

    function renderSchedule() {
      const nowInfo = getNowInfo();
      document.getElementById('clockLabelEl').textContent = 'เวลา ' + toDot(nowInfo.hhmm) + ' น.';

      const tabAll = document.getElementById('tabAllBtn');
      const tabHi = document.getElementById('tabHighlightBtn');

      tabAll.className = activeFilter === 'ALL'
        ? 'py-1.5 px-3 rounded-[9px] text-[12px] font-semibold segmented-tab-active transition text-center'
        : 'py-1.5 px-3 rounded-[9px] text-[12px] font-normal text-[#64748B] transition text-center';

      tabHi.className = activeFilter === 'HIGHLIGHT'
        ? 'py-1.5 px-3 rounded-[9px] text-[12px] font-semibold segmented-tab-active transition text-center'
        : 'py-1.5 px-3 rounded-[9px] text-[12px] font-normal text-[#64748B] transition text-center';

      const visible = activeFilter === 'HIGHLIGHT'
        ? AGENDA_ITEMS.filter((it) => Boolean(it.isHighlight))
        : AGENDA_ITEMS;

      const mount = document.getElementById('scheduleMount');

      if (EVENT_CONFIG.LAYOUT_STYLE === 'CARDS') {
        mount.className = 'px-4 pt-2.5 pb-4 space-y-2.5';
        mount.innerHTML = visible
          .map((item) => renderCardItem(item, getItemStatus(item, nowInfo)))
          .join('');
      } else {
        mount.className = 'px-5 pt-3 pb-4';
        mount.innerHTML = visible
          .map((item, idx) =>
            renderTimelineItem(
              item,
              getItemStatus(item, nowInfo),
              idx === 0,
              idx === visible.length - 1
            )
          )
          .join('');
      }
    }

    function renderTimelineItem(item, status, isFirst, isLast) {
      const isLive = status === 'LIVE';
      const isPast = status === 'PAST';
      const sDot = escapeHtml(toDot(item.start));
      const eDot = escapeHtml(toDot(item.end));
      const sub = String(item.subtitle || '').trim();
      const tag = String(item.tag || '').trim();

      const topLine = !isFirst ? '<div class="absolute top-0 h-[10px] w-[1px] bg-[#CBD5E1]"></div>' : '';
      const botLine = !isLast ? '<div class="absolute top-[10px] bottom-0 w-[1px] bg-[#CBD5E1]"></div>' : '';

      let dotHtml = '<span class="relative z-10 mt-[6px] w-[8px] h-[8px] rounded-full bg-white border-[1.75px] border-[#94A3B8]"></span>';
      if (isLive) {
        dotHtml = '<span class="relative z-10 mt-[6px] live-dot-node"></span>';
      } else if (isPast) {
        dotHtml = '<span class="relative z-10 mt-[6.5px] w-[7px] h-[7px] rounded-full bg-[#CBD5E1]"></span>';
      } else if (item.isHighlight) {
        dotHtml = '<span class="relative z-10 mt-[6px] w-[8px] h-[8px] rounded-full bg-white border-[2px] border-[#E60012]"></span>';
      }

      let rightContent = '';
      if (isLive) {
        rightContent =
          '<div class="' + (isLast ? 'mb-0' : 'mb-4') + ' live-editorial-box px-3.5 py-3">' +
            '<div class="flex items-center justify-between gap-2 mb-1">' +
              '<span class="inline-flex items-center gap-1.5 text-[10px] font-semibold text-[#E60012] tracking-wide">' +
                '<span class="w-1.5 h-1.5 rounded-full bg-[#E60012] animate-pulse"></span>' +
                '<span>กำลังดำเนินการ</span>' +
              '</span>' +
              (tag ? '<span class="text-[9.5px] font-semibold uppercase tracking-[0.16em] text-[#991B1B]">' + escapeHtml(tag) + '</span>' : '') +
            '</div>' +
            '<h2 class="text-[15px] font-semibold text-[#0F172A] leading-snug">' + escapeHtml(item.title) + '</h2>' +
            (sub ? '<p class="text-[12.5px] font-normal text-[#475569] mt-0.5 leading-relaxed">' + escapeHtml(sub) + '</p>' : '') +
          '</div>';
      } else {
        const borderCls = isLast ? 'pb-1' : 'pb-4 mb-4 border-b border-slate-200/75';
        const tagCls = item.isHighlight ? 'text-[#E60012] font-semibold' : 'text-[#64748B] font-medium';
        const titleCls = item.isHighlight ? 'font-semibold text-[#0F172A]' : 'font-medium text-[#1E293B]';
        rightContent =
          '<div class="' + borderCls + '">' +
            (tag ? '<p class="text-[9.5px] uppercase tracking-[0.16em] ' + tagCls + ' mb-0.5">' + escapeHtml(tag) + '</p>' : '') +
            '<h2 class="text-[15px] ' + titleCls + ' leading-snug">' + escapeHtml(item.title) + '</h2>' +
            (sub ? '<p class="text-[12.5px] font-light text-[#475569] mt-0.5 leading-relaxed">' + escapeHtml(sub) + '</p>' : '') +
          '</div>';
      }

      return (
        '<div class="timeline-row-grid ' + (isPast ? 'opacity-[0.46]' : 'opacity-100') + '">' +
          '<div class="text-right tabular-nums pt-[1px]">' +
            '<p class="text-[14px] ' + (isLive ? 'font-semibold text-[#E60012]' : 'font-semibold text-[#0F172A]') + ' leading-tight">' + sDot + '</p>' +
            (eDot ? '<p class="text-[11px] font-light ' + (isLive ? 'text-[#991B1B]' : 'text-[#64748B]') + ' mt-0.5 leading-tight">' + eDot + ' น.</p>' : '') +
          '</div>' +
          '<div class="relative flex justify-center">' + topLine + botLine + dotHtml + '</div>' +
          '<div class="min-w-0">' + rightContent + '</div>' +
        '</div>'
      );
    }

    function renderCardItem(item, status) {
      const isLive = status === 'LIVE';
      const isPast = status === 'PAST';
      const range = escapeHtml(toDot(item.start) + (item.end ? ' – ' + toDot(item.end) + ' น.' : ' น.'));
      const sub = String(item.subtitle || '').trim();
      const tag = String(item.tag || '').trim();

      const cls = isLive
        ? 'editorial-clean-card-live px-4 py-3.5'
        : 'editorial-clean-card px-4 py-3 ' + (isPast ? 'opacity-[0.48]' : '');

      const timeHtml = isLive
        ? '<span class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-[#E60012] tabular-nums"><span class="w-1.5 h-1.5 rounded-full bg-[#E60012] animate-pulse"></span><span>' + range + ' • กำลังดำเนินการ</span></span>'
        : '<span class="text-[12px] font-medium text-[#64748B] tabular-nums tracking-wide">' + range + '</span>';

      const tagHtml = tag
        ? '<span class="text-[9.5px] uppercase tracking-[0.16em] ' + (isLive || item.isHighlight ? 'font-semibold text-[#E60012]' : 'font-medium text-[#64748B]') + '">' + escapeHtml(tag) + '</span>'
        : '';

      return (
        '<article class="' + cls + '">' +
          '<div class="flex items-center justify-between gap-2">' + timeHtml + tagHtml + '</div>' +
          '<h2 class="text-[15px] ' + (isLive || item.isHighlight ? 'font-semibold text-[#0F172A]' : 'font-medium text-[#1E293B]') + ' leading-snug mt-1">' + escapeHtml(item.title) + '</h2>' +
          (sub ? '<p class="text-[12.5px] font-light text-[#475569] mt-0.5 leading-relaxed">' + escapeHtml(sub) + '</p>' : '') +
        '</article>'
      );
    }

    async function loadFromGoogleSheetCsv(csvUrl) {
      try {
        const res = await fetch(csvUrl, { cache: 'no-store' });
        if (!res.ok) return;
        const text = await res.text();
        const rows = parseCsv(text);
        if (rows.length <= 1) return;

        const nextList = [];
        for (let i = 1; i < rows.length; i++) {
          const c = rows[i];
          const start = String(c[0] || '').trim();
          const title = String(c[2] || '').trim();
          if (!start || !title) continue;
          const hi = String(c[5] || '').trim().toLowerCase();
          nextList.push({
            start: start,
            end: String(c[1] || '').trim(),
            title: title,
            subtitle: String(c[3] || '').trim(),
            tag: String(c[4] || '').trim(),
            isHighlight: hi === 'true' || hi === '1' || hi === 'yes'
          });
        }
        if (nextList.length > 0) {
          AGENDA_ITEMS = nextList;
          renderSchedule();
        }
      } catch (e) {
        console.warn('Using built-in AGENDA_ITEMS:', e);
      }
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const nx = text[i + 1];
        if (q) {
          if (ch === '"' && nx === '"') { cur += '"'; i++; }
          else if (ch === '"') q = false;
          else cur += ch;
        } else {
          if (ch === '"') q = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; }
          else cur += ch;
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur.replace(/\r$/, ''));
        rows.push(row);
      }
      return rows;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
